<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a060e"/>
      <stop offset="100%" stop-color="#030305"/>
    </linearGradient>
    <linearGradient id="argentGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff1e27"/>
      <stop offset="50%" stop-color="#ff7b00"/>
      <stop offset="100%" stop-color="#ffaa00"/>
    </linearGradient>
    <linearGradient id="cyberGlow" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff1e27"/>
      <stop offset="100%" stop-color="#00f0ff"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Dark Obsidian Base Squircle -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#bgGrad)" stroke="#ff1e27" stroke-width="1.5" stroke-opacity="0.45"/>

  <!-- Subtle Inner Ambient Glow -->
  <circle cx="32" cy="30" r="18" fill="#ff1e27" fill-opacity="0.12" filter="url(#glow)"/>

  <!-- Stylized Geometric "A" Insignia (Aneesh / AI Architect) -->
  <path d="M32 10 L48 50 L40 50 L35.5 38 L28.5 38 L24 50 L16 50 Z M32 20.5 L29.5 32 L34.5 32 Z" 
        fill="url(#argentGlow)" 
        filter="url(#glow)"/>

  <!-- Precision High-Tech Crossbar Reticle Core -->
  <polygon points="32,29 36,33 32,37 28,33" fill="#ffffff"/>
  <circle cx="32" cy="33" r="1.5" fill="#ffaa00"/>

  <!-- Corner Tactical Accent Blips -->
  <circle cx="10" cy="10" r="1.5" fill="#ff1e27" opacity="0.7"/>
  <circle cx="54" cy="10" r="1.5" fill="#ffaa00" opacity="0.7"/>
</svg>
